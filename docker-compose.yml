services:
  postgres:
    image: postgres:15
    container_name: banking-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: banking
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql # ← moved here

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  auth-service:
    build: ./services/auth-service
    ports:
      - "4005:4005"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: banking
      JWT_SECRET: supersecretkey123
    depends_on:
      - postgres

  account-service:
    build: ./services/account-service
    ports:
      - "4001:4001"
    environment:
      JWT_SECRET: supersecretkey123
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: banking
    depends_on:
      - postgres

  transaction-service:
    build: ./services/transaction-service
    ports:
      - "4002:4002"
    environment:
      JWT_SECRET: supersecretkey123
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: banking
    depends_on:
      postgres:
        condition: service_started
      kafka:
        condition: service_started

  fraud-service:
    build: ./services/fraud-service
    ports:
      - "4003:4003"

  notification-service:
    build: ./services/notification-service
    ports:
      - "4004:4004"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile 
    ports:
      - "80:80"
    depends_on:
      - account-service
      - transaction-service
      - auth-service

# ← this must be at root level, zero indentation
volumes:
  postgres_data:
